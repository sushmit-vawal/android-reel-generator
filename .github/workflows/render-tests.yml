name: Android Render Tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --stacktrace || { adb logcat -d > render-logcat.txt; exit 1; }
            mkdir -p artifacts
            adb pull /sdcard/Android/data/com.reelgenerator/files/render-tests artifacts/render-tests || echo 'No optional render evidence directory was produced.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-verification
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            artifacts/render-tests/
            render-logcat.txt
